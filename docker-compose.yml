services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway-1:
    build: .
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  gateway-2:
    build: .
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  gateway-3:
    build: .
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - gateway-1
      - gateway-2
      - gateway-3
    restart: on-failure:5
